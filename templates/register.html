{% extends "base.html" %}
{% block title %}注册 - TagTok{% endblock %}
{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <h1 class="auth-title">TagTok</h1>
        <p class="auth-sub">创建新账号</p>
        <form method="post">
            <input type="text" name="username" placeholder="用户名" required autofocus>
            <input type="text" name="nickname" placeholder="昵称（可选）">
            <input type="password" name="password" placeholder="密码" required>
            <button type="submit" class="btn-primary">注册</button>
        </form>
        <p class="auth-hint">已有账号？<a href="{{ url_for('login') }}">去登录</a></p>
    </div>
</div>
{% endblock %}
