<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>{% block title %}TagTok{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
{% if current_user %}
<nav class="navbar">
    <a href="{{ url_for('feed') }}" class="nav-logo">TagTok</a>
    <div class="nav-links">
        <a href="{{ url_for('feed') }}" class="{{ 'active' if request.path == '/' }}">首页</a>
        <a href="{{ url_for('profile') }}" class="{{ 'active' if request.path == '/profile' }}">我的标签</a>
        <a href="{{ url_for('match_page') }}" class="{{ 'active' if request.path == '/match' }}">交友</a>
        <a href="{{ url_for('matches_page') }}" class="{{ 'active' if request.path == '/matches' }}">我的配对</a>
        <a href="{{ url_for('logout') }}">退出（{{ current_user.nickname }}）</a>
    </div>
</nav>
{% endif %}

<div class="flash-container">
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for msg in messages %}
                <div class="flash-msg">{{ msg }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}
</div>

<main>
{% block content %}{% endblock %}
</main>

</body>
</html>
