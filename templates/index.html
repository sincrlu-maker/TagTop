{% extends "base.html" %}
{% block title %}首页 - TagTok{% endblock %}
{% block content %}
<div class="feed-container" id="feed-container">
    {% for video in videos %}
    <section class="feed-item" data-video-id="{{ video.id }}">
        <video
            class="feed-video"
            src="{{ video.url }}"
            loop
            playsinline
            preload="metadata"
        ></video>
        <div class="feed-overlay">
            <div class="feed-info">
                <p class="feed-author">@{{ video.author }}</p>
                <p class="feed-title">{{ video.title }}</p>
                <span class="feed-category-tag">#{{ video.category }}</span>
            </div>
            <div class="feed-actions">
                <button class="action-btn like-btn" data-action="like">
                    <span class="icon">❤️</span>
                    <span class="count">喜欢</span>
                </button>
                <button class="action-btn skip-btn" data-action="skip">
                    <span class="icon">➡️</span>
                    <span class="count">划走</span>
                </button>
            </div>
        </div>
    </section>
    {% else %}
    <div class="empty-state">暂无视频，先运行 init_db.py 添加演示数据吧～</div>
    {% endfor %}
</div>
<script src="{{ url_for('static', filename='js/feed.js') }}"></script>
{% endblock %}
