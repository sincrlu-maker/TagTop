{% extends "base.html" %}
{% block title %}交友 - TagTok{% endblock %}
{% block content %}
<div class="match-wrap">
    <div id="card-stack" class="card-stack">
        <p class="empty-state" id="loading-hint">正在加载推荐...</p>
    </div>
    <div class="match-actions">
        <button id="pass-btn" class="round-btn pass-btn">✕</button>
        <button id="like-btn" class="round-btn like-btn-round">❤</button>
    </div>
</div>

<div id="match-toast" class="match-toast hidden">
    <div class="match-toast-content">
        <h2>配对成功！🎉</h2>
        <p>你们互相喜欢对方，快去打个招呼吧</p>
        <button onclick="document.getElementById('match-toast').classList.add('hidden')">好的</button>
    </div>
</div>

<script src="{{ url_for('static', filename='js/match.js') }}"></script>
{% endblock %}
