{% extends "base.html" %}
{% block title %}登录 - TagTok{% endblock %}
{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <h1 class="auth-title">TagTok</h1>
        <p class="auth-sub">登录以继续</p>
        <form method="post">
            <input type="text" name="username" placeholder="用户名" required autofocus>
            <input type="password" name="password" placeholder="密码" required>
            <button type="submit" class="btn-primary">登录</button>
        </form>
        <p class="auth-hint">还没有账号？<a href="{{ url_for('register') }}">立即注册</a></p>
        <p class="auth-hint">演示账号：alice / bob / carol / dave / eva，密码均为 123456</p>
    </div>
</div>
{% endblock %}
